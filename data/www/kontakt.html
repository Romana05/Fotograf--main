<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kontakt · Žan Lah Koštomaj</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg site-navbar">
      <div class="container-fluid px-3 px-lg-5">
        <a class="navbar-brand p-0 d-lg-none" href="index.html">
          <img src="assets/logo.png" alt="Logo" class="site-logo" style="max-height:60px" />
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav w-100 justify-content-between align-items-lg-center text-center">
            <li class="nav-item"><a class="nav-link" href="index.html">DOMOV</a></li>
            <li class="nav-item"><a class="nav-link" href="o-meni.html">O&nbsp;MENI</a></li>
            <li class="nav-item d-none d-lg-block"><a class="navbar-brand p-0" href="index.html"><img src="assets/logo.png" alt="Logo" class="site-logo" /></a></li>
            <li class="nav-item"><a class="nav-link" href="storitve.html">STORITVE</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="kontakt.html">KONTAKT</a></li>
            <li class="nav-item"><a class="nav-link" href="galerija.html">GALERIJA</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4 py-lg-5">

    <section class="row g-4 align-items-start mb-4">
      <div class="col-12 col-md-4 contact-info">
        <h1 class="title-display">Kontakt</h1>
        <ul class="list-unstyled m-0">
          <li class="d-flex align-items-center gap-2 mb-3">
            <img src="assets/icon-tel.png" alt="" class="icon" />
            <a href="tel:+38631580464" class="label text-decoration-none">031 580 464</a>
          </li>
          <li class="d-flex align-items-center gap-2">
            <img src="assets/icon-mail.png" alt="" class="icon mail" />
            <a href="mailto:zan.kostomaj@email.si" class="label text-decoration-none">zan.kostomaj@email.si</a>
          </li>
        </ul>
      </div>

      <div class="col-12 col-md-8 text-md-end">
        <h2 class="title-display mb-2">Delovni čas:</h2>
        <p class="font-display" style="font-size:1.25rem">Odvisno od dogodka</p>
      </div>
    </section>

    <section class="row g-4 g-lg-5 align-items-stretch">
      <div class="col-12 col-lg-6">
        <h2 class="title-display">Imaš vprašanje?</h2>
        <p class="font-display">Izpolni kontaktni obrazec in odgovorim ti v najkrajšem možnem času.</p>

        <form class="contact-form mt-3" novalidate>
          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <label for="ime" class="visually-hidden">Ime</label>
              <input type="text" id="ime" name="ime" class="form-control" placeholder="Ime..." required />
            </div>
            <div class="col-12 col-sm-6">
              <label for="priimek" class="visually-hidden">Priimek</label>
              <input type="text" id="priimek" name="priimek" class="form-control" placeholder="Priimek..." required />
            </div>
            <div class="col-12">
              <label for="email" class="visually-hidden">E-pošta</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="E-pošta..." required />
            </div>
            <div class="col-12">
              <label for="vprasanje" class="visually-hidden">Vprašanje</label>
              <textarea id="vprasanje" name="vprasanje" rows="5" class="form-control" placeholder="Vprašanje..." required></textarea>
            </div>
            <div class="col-12">
              <button type="submit" class="btn btn-send">Pošlji</button>
            </div>
          </div>
        </form>
      </div>

      <div class="col-12 col-lg-6">
        <h2 class="title-display">Kje me najdeš?</h2>
        <div class="map-frame" role="img" aria-label="Zemljevid lokacije"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3">
        <a href="#" aria-label="Instagram"><img src="assets/social-instagram.png" alt="Instagram" class="social-icon" /></a>
        <a href="#" aria-label="Facebook"><img src="assets/social-facebook.png" alt="Facebook" class="social-icon" /></a>
      </div>
      <small class="m-0">copyright &copy; 2026</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
